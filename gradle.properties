# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Point Gradle at a JDK 25 install (required to target Minecraft 26.2 / release 25).
# Adjust this path if JDK 25 lives elsewhere on your machine.
org.gradle.java.home=C:/Program Files/Java/jdk-25.0.2

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.19

# Fabric API
fabric_api_version=0.157.0+26.2

# Mod Properties
mod_version=1.2.4
maven_group=net.aechronis.hitboxes
archives_base_name=aechronishitboxes

# Dependencies
cloth_config_version=26.2.155+fabric
mod_menu_version=20.0.1
mixinextras_version=0.5.4
